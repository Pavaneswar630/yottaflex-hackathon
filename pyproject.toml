[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-scheduler"
version = "1.0.0"
description = "Deterministic production scheduling data generator with validation and an optional RAG/LLM API"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
ui = ["streamlit>=1.49", "pandas>=2.2", "plotly>=5.20", "requests>=2.31"]
test = ["pytest>=8"]

[project.scripts]
scheduling-lab = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
